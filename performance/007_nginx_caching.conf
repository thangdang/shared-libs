# Nginx Performance — Response Caching + Compression
# Include in /etc/nginx/nginx.conf (http block)
# Or include per-site in /etc/nginx/sites-available/winlux.com

# ═══════════════════════════════════════
# Proxy Cache Zone (shared across all services)
# ═══════════════════════════════════════
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=500m inactive=10m;

# ═══════════════════════════════════════
# Gzip Compression
# ═══════════════════════════════════════
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1000;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;

