# NOTE: Do NOT cache:
# - /api/auth/* (user-specific)
# - /api/payment/* (sensitive)
# - /api/ai/* (personalized responses)
# - POST requests (mutations)

# ═══════════════════════════════════════
# Connection Optimization
# ═══════════════════════════════════════
upstream trendbriefai_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream smartbuy_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream caremate_backend {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream fintax_backend {
    server 127.0.0.1:3003;
    keepalive 16;
}

upstream childhood_backend {
    server 127.0.0.1:3005;
    keepalive 16;
}

# ═══════════════════════════════════════
# Security Headers (also improves SEO)
# ═══════════════════════════════════════
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
