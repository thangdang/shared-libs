<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{alertTitle}}</title>
  <style>
    :root {
      --brand-color: {{brandColor}};
      --brand-logo-url: {{brandLogoUrl}};
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f7;">
    <tr>
      <td align="center" style="padding: 24px 16px;">
        <!-- Header -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px;">
          <tr>
            <td align="center" style="padding: 24px 0;">
              <img src="{{brandLogoUrl}}" alt="{{productName}}" style="height: 40px; max-width: 180px;" />
            </td>
          </tr>
        </table>

        <!-- Main Content -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px; background-color: #ffffff; border-radius: 8px; overflow: hidden;">
          <tr>
            <td style="padding: 32px 24px;">
              <!-- Priority Indicator -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 20px;">
                <tr>
                  <td>
                    <span style="display: inline-block; padding: 4px 12px; background-color: {{priorityColor}}; color: #ffffff; font-size: 12px; font-weight: 600; border-radius: 12px; text-transform: uppercase;">
                      {{priorityLabel}}
                    </span>
                  </td>
                </tr>
              </table>

              <!-- Alert Icon + Title -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 16px;">
                <tr>
                  <td style="width: 48px; vertical-align: top;">
                    <div style="width: 40px; height: 40px; background-color: {{priorityColor}}; border-radius: 50%; text-align: center; line-height: 40px; font-size: 20px;">
                      {{alertIcon}}
                    </div>
                  </td>
                  <td style="vertical-align: middle; padding-left: 12px;">
                    <h1 style="margin: 0; font-size: 20px; color: #111827;">{{alertTitle}}</h1>
                  </td>
                </tr>
              </table>

              <!-- Alert Message -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom: 24px;">
                <tr>
                  <td style="padding: 16px; background-color: #f9fafb; border-left: 4px solid {{priorityColor}}; border-radius: 0 6px 6px 0;">
                    <p style="margin: 0; font-size: 14px; color: #374151; line-height: 1.6;">
                      {{alertMessage}}
                    </p>
                  </td>
                </tr>
              </table>

              <!-- Action Button -->
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding: 8px 0;">
                    <a href="{{actionUrl}}" style="display: inline-block; padding: 14px 32px; background-color: {{brandColor}}; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none; border-radius: 6px;">
                      {{actionText}}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!-- Footer -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 600px;">
          <tr>
            <td align="center" style="padding: 24px 16px; color: #6b7280; font-size: 12px; line-height: 1.5;">
              <p style="margin: 0 0 8px 0;">© {{year}} WinLux. Mọi quyền được bảo lưu.</p>
              <p style="margin: 0;">
                <a href="{{unsubscribeUrl}}" style="color: #6b7280; text-decoration: underline;">Hủy đăng ký nhận email</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
