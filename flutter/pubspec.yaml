name: winlux_core
description: Shared Flutter package for all WinLux mobile apps — auth, API, payment, notifications, offline.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  firebase_messaging: ^15.0.0
  firebase_analytics: ^11.0.0
  firebase_crashlytics: ^4.0.0
  flutter_local_notifications: ^17.0.0
  sqflite: ^2.3.2
  connectivity_plus: ^6.0.0
  in_app_purchase: ^3.1.0
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.3
  share_plus: ^9.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
