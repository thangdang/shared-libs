[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-vn-nlp"
version = "0.1.0"
description = "Shared Vietnamese NLP library for AI engines"
requires-python = ">=3.10"
dependencies = [
    "underthesea>=6.8.0",
    "lunardate>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared_vn_nlp*"]

[tool.setuptools.package-data]
shared_vn_nlp = ["data/*.json"]
