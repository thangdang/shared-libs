[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "winlux"
version = "1.0.0"
description = "Unified shared library for all WinLux AI products — NLP, LLM client, crawler, RAG"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "WinLux AI Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
nlp = [
    "underthesea>=6.8.0",
    "pyvi>=0.1.1",
]
llm = [
    "ollama>=0.3.0",
    "groq>=0.9.0",
    "openai>=1.30.0",
]
crawler = [
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
]
rag = [
    "faiss-cpu>=1.8.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
all = [
    "winlux[nlp,llm,crawler,rag]",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/winlux-ai/winlux"
Documentation = "https://docs.winlux.com"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"winlux.nlp.data" = ["*.json", "*.txt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
