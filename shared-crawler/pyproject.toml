[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-crawler"
version = "0.2.0"
description = "Shared config-driven crawl engine with proxy pool, scheduler, translation, and dedup"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "feedparser>=6.0.0",
    "beautifulsoup4>=4.12.0",
    "redis>=5.0.0",
    "motor>=3.3.0",
    "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared_crawler*"]
