# Doctor Car AI — Model routing configuration
# Maps task_type → model selection rules

product: doctorcar
version: "1.0"

default_model: "qwen2.5:7b"
default_timeout: 15

tasks:
  # Simple tasks (qwen2.5:1.5b)
  cost_estimation:
    complexity: simple
    model: "qwen2.5:1.5b"
    timeout: 5
    max_tokens: 100
    description: "Estimate repair cost range"

  safety_check:
    complexity: simple
    model: "qwen2.5:1.5b"
    timeout: 5
    max_tokens: 50
    description: "Check if symptom is safety-critical"

  # Medium tasks (qwen2.5:7b)
  symptom_extraction:
    complexity: medium
    model: "qwen2.5:7b"
    timeout: 15
    max_tokens: 300
    description: "Extract car symptoms from Vietnamese slang"

  severity_assessment:
    complexity: medium
    model: "qwen2.5:7b"
    timeout: 15
    max_tokens: 200
    description: "Assess severity of car problem (1-5)"

  # Thinking tasks (qwen3:8b /think)
  diagnosis_reasoning:
    complexity: thinking
    model: "qwen3:8b"
    timeout: 60
    max_tokens: 1000
    thinking_mode: true
    description: "Deep diagnostic reasoning with multiple possible causes"

  # Creative tasks (qwen3:8b)
  content_generation:
    complexity: creative
    model: "qwen3:8b"
    timeout: 45
    max_tokens: 800
    description: "Generate car care article content"

# Hybrid engine trust levels
hybrid_rules:
  cost_estimation: rule_primary    # Rule calculates from DB, AI validates
  safety_check: rule_only         # Brake/steering/airbag ALWAYS by regex
  diagnosis: ai_primary           # AI diagnoses, post-check by rules
  content: ai_only                # AI generates articles

# Safety: sensitivity routing
sensitivity:
  diagnosis_reasoning: medium     # No PII, just car symptoms
  symptom_extraction: low         # No sensitive data
  content_generation: low         # Public content

# Cache TTLs
cache_ttl:
  cost_estimation: 604800       # 7d — parts prices are semi-stable
  safety_check: 2592000         # 30d — safety rules don't change
  symptom_extraction: 0         # Never cache (user-specific)
  diagnosis_reasoning: 0        # Never cache (user-specific)
  content_generation: 86400     # 24h
