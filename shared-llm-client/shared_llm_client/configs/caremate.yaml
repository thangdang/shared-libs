# CareMate AI — Model routing configuration
# Maps task_type → model selection rules

product: caremate
version: "1.0"

default_model: "qwen2.5:7b"
default_timeout: 15

tasks:
  # Simple tasks (qwen2.5:1.5b)
  intent_classification:
    complexity: simple
    model: "qwen2.5:1.5b"
    timeout: 5
    max_tokens: 50
    description: "Classify user health intent (symptom, drug, info)"

  severity_scoring:
    complexity: simple
    model: "qwen2.5:1.5b"
    timeout: 5
    max_tokens: 50
    description: "Score severity level (low/medium/high/emergency)"

  drug_check:
    complexity: simple
    model: "qwen2.5:1.5b"
    timeout: 5
    max_tokens: 100
    description: "Check drug interaction (supplement to rule engine)"

  # Medium tasks (qwen2.5:7b)
  symptom_extraction:
    complexity: medium
    model: "qwen2.5:7b"
    timeout: 15
    max_tokens: 300
    description: "Extract symptoms from Vietnamese slang input"

  article_summary:
    complexity: medium
    model: "qwen2.5:7b"
    timeout: 15
    max_tokens: 400
    description: "Summarize health article for Vietnamese readers"

  # Complex/Thinking tasks (qwen3:8b)
  symptom_analysis:
    complexity: thinking
    model: "qwen3:8b"
    timeout: 60
    max_tokens: 800
    thinking_mode: true
    description: "Deep symptom analysis with possible conditions"

  response_generation:
    complexity: complex
    model: "qwen3:8b"
    timeout: 30
    max_tokens: 600
    description: "Generate health advice response with citations"

# Hybrid engine trust levels
hybrid_rules:
  drug_interaction: rule_only     # Drug interactions ALWAYS from rule engine/DB
  severity: rule_primary          # Rule decides, AI validates
  emergency_detection: rule_only  # Emergency keywords by regex only
  response: ai_primary            # AI generates, post-validation by rule
  disclaimer: rule_only           # Always appended by template

# Safety: sensitivity routing
sensitivity:
  symptom_analysis: high     # Ollama only (never external)
  drug_check: high           # Ollama only
  response_generation: medium  # Prefer Ollama, external + sanitization OK
  article_summary: low       # Any provider OK

# Cache TTLs
cache_ttl:
  intent_classification: 3600   # 1h
  severity_scoring: 0           # Never cache (user-specific)
  symptom_extraction: 0         # Never cache
  article_summary: 86400        # 24h
  drug_check: 604800            # 7d — drug data is stable
