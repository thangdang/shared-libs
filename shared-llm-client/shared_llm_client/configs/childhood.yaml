# Childhood Video Engine — Model routing configuration
# Maps task_type → model selection rules

product: childhood
version: "1.0"

default_model: "qwen2.5:7b"
default_timeout: 15

tasks:
  # Simple tasks (qwen2.5:1.5b)
  topic_scoring:
    complexity: simple
    model: "qwen2.5:1.5b"
    timeout: 5
    max_tokens: 50
    description: "Score topic virality potential"

  hook_scoring:
    complexity: simple
    model: "qwen2.5:1.5b"
    timeout: 5
    max_tokens: 50
    description: "Score hook effectiveness"

  seo_tags:
    complexity: simple
    model: "qwen2.5:1.5b"
    timeout: 5
    max_tokens: 100
    description: "Generate SEO tags/hashtags"

  # Medium tasks (qwen2.5:7b)
  trend_analysis:
    complexity: medium
    model: "qwen2.5:7b"
    timeout: 15
    max_tokens: 400
    description: "Analyze trending topics for content opportunities"

  quality_gate:
    complexity: medium
    model: "qwen2.5:7b"
    timeout: 15
    max_tokens: 300
    description: "Evaluate script quality dimensions"

  channel_strategy:
    complexity: medium
    model: "qwen2.5:7b"
    timeout: 15
    max_tokens: 500
    description: "Channel-specific content strategy"

  # Thinking tasks (qwen3:8b /think)
  content_planning:
    complexity: thinking
    model: "qwen3:8b"
    timeout: 60
    max_tokens: 1000
    thinking_mode: true
    description: "Plan content calendar with trend alignment"

  # Creative tasks (qwen3:8b)
  script_writing:
    complexity: creative
    model: "qwen3:8b"
    timeout: 45
    max_tokens: 2000
    description: "Write video script with hooks and CTA"

  humanization:
    complexity: creative
    model: "qwen3:8b"
    timeout: 45
    max_tokens: 2000
    description: "Humanize script to avoid AI detection"

# Hybrid engine trust levels
hybrid_rules:
  topic_scoring: rule_primary     # Rule scores, AI validates
  quality_gate: rule_primary      # Rule evaluates dimensions, AI refines
  script_writing: ai_primary      # AI creates, post-check by rule
  humanization: ai_only           # Fully AI creative task

# Cache TTLs
cache_ttl:
  topic_scoring: 21600         # 6h — trends shift
  hook_scoring: 86400          # 24h — hook patterns are stable
  seo_tags: 43200             # 12h
  trend_analysis: 7200        # 2h — trends are time-sensitive
  content_planning: 0         # Never cache (unique per run)
  script_writing: 0           # Never cache (unique)
