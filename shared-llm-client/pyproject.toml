[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-llm-client"
version = "0.1.0"
description = "Shared unified LLM client with retry, caching, circuit breaker, and fallback"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
groq = ["groq>=0.4.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared_llm_client*"]
